<div class="flex items-center border-1 border-gray-950 justify-center p-4">
  <!-- Inputs (left side) -->
  <div class="flex flex-col gap-4">
    @for (input of inputs(); track $index) {
      <div>
        <handle position="left" type="target"></handle>
      </div>
    }
  </div>

  <!-- Node Title (center) -->
  <div class="flex-1 text-center font-bold text-gray-900">{{ title() }}</div>

  <!-- Outputs (right side) -->
  <div class="flex flex-col gap-4">
    @for (output of outputs(); track $index) {
      <div>
        <handle position="right" type="source"></handle>
      </div>
    }
  </div>
</div>
